[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scd-repro"
version = "0.1.0"
description = "语义缓存蒸馏（SCD）复现工具包"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "SCD 复现团队"}
]
dependencies = [
  "numpy>=2.0.0",
  "scipy>=1.10.0",
  "matplotlib>=3.8.0",
  "torch>=2.2.0",
  "transformers>=4.45.0"
]

[project.optional-dependencies]
ml = [
  "datasets>=2.20.0"
]
test = []

[project.scripts]
capture-pair = "scd_repro.cli.capture_pair:main"
train-reuse = "scd_repro.cli.train_reuse:main"
profile-layers = "scd_repro.cli.profile_layers:main"
train-patch = "scd_repro.cli.train_patch:main"
build-route = "scd_repro.cli.build_route:main"
infer = "scd_repro.cli.infer:main"
eval = "scd_repro.cli.eval_cmd:main"
report = "scd_repro.cli.report_cmd:main"
search-blockwise-hybrid = "scd_repro.cli.search_blockwise_hybrid:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
